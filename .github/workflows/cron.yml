name: cron-tick
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil KARTA cron tick
        run: |
          curl -fsS "${{ secrets.APP_URL }}/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

